name: BB MQ current unique exact-head gate 20260812

on:
  pull_request:

jobs:
  gate:
    name: BB_MQ_CURRENT_EXACT_GATE_20260812_Z9X3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Reject FAIL_FRESH_QUEUE marker on exact PR head
