        run: |
          if [ -f BB_MQ_STRICT_GATE_20260811.txt ] && grep -q 'FAIL_FRESH_QUEUE' BB_MQ_STRICT_GATE_20260811.txt; then
            echo 'exact-head gate rejected FAIL_FRESH_QUEUE marker'
